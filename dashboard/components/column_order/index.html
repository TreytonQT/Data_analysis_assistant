<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Source Sans Pro", sans-serif;
      }

      body {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        background: transparent;
        color: inherit;
        width: 100%;
      }

      .column-order {
        box-sizing: border-box;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 2px 0 10px;
        width: 100%;
      }

      .chip {
        border: 1px solid rgba(120, 120, 120, 0.42);
        border-radius: 6px;
        background: rgba(120, 120, 120, 0.12);
        color: inherit;
        cursor: grab;
        font-size: 13px;
        line-height: 1.25;
        max-width: min(260px, 100%);
        min-height: 34px;
        padding: 7px 10px;
        text-align: left;
        user-select: none;
        white-space: normal;
        word-break: break-word;
      }

      .chip:active {
        cursor: grabbing;
      }

      .chip.dragging {
        opacity: 0.45;
      }

      .chip.drag-over {
        border-color: #3b82f6;
        box-shadow: inset 0 0 0 1px #3b82f6;
      }
    </style>
  </head>
  <body>
    <div id="column-order" class="column-order" aria-label="拖拽列名调整列顺序"></div>

    <script>
      const root = document.getElementById("column-order");
      let columns = [];
      let draggedIndex = null;

      function sendMessage(type, data) {
        window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
      }

      function setFrameHeight() {
        const height = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight, 180);
        sendMessage("streamlit:setFrameHeight", { height });
      }

      function setComponentValue(value) {
        sendMessage("streamlit:setComponentValue", { value });
      }

      function syncRootWidth() {
        const width = Math.max(window.innerWidth || 0, 320);
        root.style.width = `${width}px`;
        root.style.maxWidth = `${width}px`;
      }

      function reorder(fromIndex, toIndex) {
        if (fromIndex === null || fromIndex === toIndex || fromIndex < 0 || toIndex < 0) {
          return;
        }
        const next = [...columns];
        const [moved] = next.splice(fromIndex, 1);
        next.splice(toIndex, 0, moved);
        columns = next;
        render();
        setComponentValue(columns);
      }

      function render() {
        syncRootWidth();
        root.innerHTML = "";
        columns.forEach((column, index) => {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "chip";
          chip.draggable = true;
          chip.textContent = column;
          chip.title = column;
          chip.setAttribute("aria-label", `拖拽调整 ${column} 的列顺序`);

          chip.addEventListener("dragstart", event => {
            draggedIndex = index;
            chip.classList.add("dragging");
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("text/plain", column);
          });

          chip.addEventListener("dragend", () => {
            draggedIndex = null;
            chip.classList.remove("dragging");
            root.querySelectorAll(".drag-over").forEach(item => item.classList.remove("drag-over"));
          });

          chip.addEventListener("dragover", event => {
            event.preventDefault();
            event.dataTransfer.dropEffect = "move";
            chip.classList.add("drag-over");
          });

          chip.addEventListener("dragleave", () => {
            chip.classList.remove("drag-over");
          });

          chip.addEventListener("drop", event => {
            event.preventDefault();
            chip.classList.remove("drag-over");
            reorder(draggedIndex, index);
          });

          root.appendChild(chip);
        });
        setFrameHeight();
      }

      window.addEventListener("message", event => {
        const message = event.data || {};
        if (message.type !== "streamlit:render") {
          return;
        }
        const incoming = Array.isArray(message.args?.columns) ? message.args.columns.map(String) : [];
        if (JSON.stringify(incoming) !== JSON.stringify(columns)) {
          columns = incoming;
          render();
        } else {
          setFrameHeight();
        }
      });
      window.addEventListener("resize", () => {
        syncRootWidth();
        setFrameHeight();
      });

      sendMessage("streamlit:componentReady", { apiVersion: 1 });
      setFrameHeight();
    </script>
  </body>
</html>
