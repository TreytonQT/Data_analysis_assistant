name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag, for example v2.2.0
        required: true
        default: v2.2.0

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      APP_NAME: DataAnalysisAssistant
      DEFAULT_RELEASE_TAG: v2.2.0
      RELEASE_SUBTITLE: 新品与价格监控

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-dev.txt
      - name: Build frontend
        shell: pwsh
        run: |
          Push-Location frontend
          python ../scripts/run_bounded.py --timeout 85 -- cmd.exe /d /c npm.cmd ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "Frontend dependency installation failed" }
          python ../scripts/run_bounded.py --timeout 85 -- cmd.exe /d /c npm.cmd run build
          if ($LASTEXITCODE -ne 0) { throw "Frontend build failed" }
          Pop-Location

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python scripts/run_bounded.py --timeout 85 -- python -m pip install --disable-pip-version-check -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Runtime dependency installation failed" }
          python scripts/run_bounded.py --timeout 85 -- python -m pip install --disable-pip-version-check -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw "Build dependency installation failed" }
          python scripts/run_bounded.py --timeout 85 -- python -m pip install --disable-pip-version-check -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw "Test dependency installation failed" }
      - name: Run regression tests
        shell: pwsh
        run: |
          Get-ChildItem tests/test_*.py | Sort-Object Name | ForEach-Object {
            python scripts/run_bounded.py --timeout 85 -- python -m pytest -q $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Backend regression failed: $($_.Name)" }
          }
          Push-Location frontend
          python ../scripts/run_bounded.py --timeout 85 -- cmd.exe /d /c npm.cmd test -- --testTimeout=10000
          if ($LASTEXITCODE -ne 0) { throw "Frontend regression failed" }
          Pop-Location

      - name: Build portable application
        shell: pwsh
        run: |
          python scripts/run_bounded.py --timeout 85 -- python -m PyInstaller --noconfirm --clean packaging/DataAnalysisAssistant.spec
          if ($LASTEXITCODE -ne 0) { throw "Portable application build failed" }
          Copy-Item configs "dist/$env:APP_NAME/configs" -Recurse
          Copy-Item "packaging/README-WINDOWS.txt" "dist/$env:APP_NAME/README-WINDOWS.txt"

      - name: Package and verify archive
        id: package
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF_NAME
          } elseif ("${{ github.event.inputs.release_tag }}") {
            $tag = "${{ github.event.inputs.release_tag }}"
          } else {
            $tag = $env:DEFAULT_RELEASE_TAG
          }
          $archive = "$env:APP_NAME-windows-x64-$tag.zip"
          Compress-Archive -Path "dist/$env:APP_NAME" -DestinationPath $archive -CompressionLevel Optimal

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $archive))
          try {
            $runtimePrefix = [regex]::Escape("$env:APP_NAME/")
            $forbidden = $zip.Entries | Where-Object {
              $entryName = $_.FullName -replace '\\', '/'
              $entryName -match "^${runtimePrefix}data/" -or
              $entryName -match "^${runtimePrefix}app\.db$" -or
              $entryName -match "^${runtimePrefix}\.tmp/"
            }
            if ($forbidden) {
              throw "Release archive contains runtime data: $($forbidden.FullName -join ', ')"
            }
            $entryNames = $zip.Entries.FullName | ForEach-Object { $_ -replace '\\', '/' }
            if (-not ($entryNames -contains "$env:APP_NAME/DataAnalysisAssistant.exe")) {
              throw "Release archive does not contain DataAnalysisAssistant.exe"
            }
          } finally {
            $zip.Dispose()
          }

          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content "$archive.sha256.txt" -Encoding ascii
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          $notes = @"
          ## Windows 便携版

          下载 **$env:RELEASE_ARCHIVE**，完整解压后双击 **DataAnalysisAssistant.exe**。

          - 无需安装 Python、Node.js 或 Docker
          - 不包含业务数据目录、SQLite 数据库、上传文件或缓存
          - 首次运行会创建新的空数据目录
          - configs 目录包含程序运行需要的默认配置
          - 服务仅监听 127.0.0.1:8000

          迁移已有数据时，请在程序关闭后手动复制旧电脑的 data 和 configs 目录。

          ## 本版本更新
          "@
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $escapedTag = [regex]::Escape($env:RELEASE_TAG)
          $entry = [regex]::Match($changelog, "(?ms)^## $escapedTag\b[^\r\n]*\r?\n(.*?)(?=^## |\z)")
          if (-not $entry.Success) { throw "CHANGELOG does not contain $env:RELEASE_TAG" }
          $notes += "`n`n" + $entry.Groups[1].Value.Trim() + "`n"
          $notes | Set-Content release-notes.md -Encoding utf8

          if (gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release upload $env:RELEASE_TAG $env:RELEASE_ARCHIVE "$env:RELEASE_ARCHIVE.sha256.txt" --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:RELEASE_TAG $env:RELEASE_ARCHIVE "$env:RELEASE_ARCHIVE.sha256.txt" --target $env:GITHUB_SHA --title "销售数据分析助手 $env:RELEASE_TAG · $env:RELEASE_SUBTITLE" --notes-file release-notes.md --repo $env:GITHUB_REPOSITORY --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
